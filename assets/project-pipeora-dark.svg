<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 124" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="PipeOra — PipeWire &amp; BlueZ Manager — Lightweight Qt 6 audio router for Arch &amp; Parch Linux on KDE Plasma.">
  <title>PipeOra — PipeWire &amp; BlueZ Manager</title>
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1119"/>
      <stop offset="100%" stop-color="#080c12"/>
    </linearGradient>
    <radialGradient id="badgeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="cardClip">
      <rect x="1" y="1" width="838" height="122" rx="14"/>
    </clipPath>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif; }
      .mono { font-family: "JetBrains Mono", "Fira Code", SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>

  <rect x="1" y="1" width="838" height="122" rx="14" fill="url(#cardBg)" stroke="#202a38" stroke-width="1.2"/>
  <g clip-path="url(#cardClip)">
    <circle cx="793" cy="77" r="76" fill="url(#badgeGlow)"/>
  </g>

  <rect x="24" y="1" width="48" height="2" rx="1" fill="#22d3ee"/>

  <!-- Left Column -->
  <text x="28" y="28" class="mono" font-size="10.5" font-weight="600" letter-spacing="1.0" fill="#22d3ee">04 // LINUX DESKTOP · AUDIO ENGINE</text>
  <text x="28" y="56" class="sans" font-size="19" font-weight="700" letter-spacing="-0.3" fill="#edf4f2">PipeOra — PipeWire &amp; BlueZ Manager</text>
  <text x="28" y="80" class="sans" font-size="13" font-weight="400" fill="#8b9baa">Lightweight Qt 6 audio router for Arch &amp; Parch Linux on KDE Plasma.</text>
  <text x="28" y="104" class="mono" font-size="11" font-weight="500" fill="#64748b">Python 3 · PySide6 (Qt 6) · PipeWire · BlueZ D-Bus · Wayland</text>

  <!-- Right Column: Status Pill -->
  <g>
    <rect x="690" y="16" width="124" height="24" rx="12" fill="#111824" stroke="#202a38" stroke-width="1"/>
    <text x="788" y="31.5" text-anchor="end" class="mono" font-size="10" font-weight="600" letter-spacing="0.45" fill="#cbd5e1">QT 6 · WAYLAND</text>
    <path d="M 795 31.5 L 802 24.5 M 797 24.5 H 802 V 29.5" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Right Column: Domain Glyph Box (42x42 at x=772, y=56) -->
  <g>
    <rect x="772" y="56" width="42" height="42" rx="10" fill="#111824" stroke="#202a38" stroke-width="1"/>
    <g transform="translate(781, 65)">
      <path d="M 6 20 V 14.5 M 6 9.5 V 4" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>

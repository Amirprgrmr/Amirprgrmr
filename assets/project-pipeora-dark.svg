      <path d="M 12 20 V 10.5 M 12 5.5 V 4" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="12" cy="8" r="2.1" fill="none" stroke="#22d3ee" stroke-width="1.5"/>
      <path d="M 18 20 V 17.5 M 18 12.5 V 4" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="18" cy="15" r="2.1" fill="none" stroke="#22d3ee" stroke-width="1.5"/>

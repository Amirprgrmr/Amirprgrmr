<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 124" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Taskora 2.0 — Super Planner — Offline-first Persian/RTL desktop planner with native Jalali calendar.">

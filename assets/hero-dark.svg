<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 248" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Amirali Homayoonzadeh — Full-Stack Web Developer and UI/UX Designer">
  <title>Amirali Homayoonzadeh | Developer OS</title>
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1119"/>
      <stop offset="100%" stop-color="#080c12"/>
    </linearGradient>

    <linearGradient id="oscBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e1520"/>
      <stop offset="100%" stop-color="#090d14"/>
    </linearGradient>

    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#00f59b"/>
    </linearGradient>

    <linearGradient id="waveArea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f59b" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f59b" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00f59b" stop-opacity="0.045"/>
      <stop offset="100%" stop-color="#00f59b" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="ambientGlow" cx="14%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#00f59b" stop-opacity="0.045"/>
      <stop offset="100%" stop-color="#00f59b" stop-opacity="0"/>
    </radialGradient>

    <pattern id="dotMatrix" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#17202d"/>
    </pattern>

    <linearGradient id="dotFade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>

    <mask id="dotMask">
      <rect x="1" y="1" width="838" height="246" fill="url(#dotFade)"/>
    </mask>

    <clipPath id="cardClip">
      <rect x="1" y="1" width="838" height="246" rx="16"/>
    </clipPath>

    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif; }
      .mono { font-family: "JetBrains Mono", "Fira Code", SFMono-Regular, Menlo, Monaco, Consolas, monospace; }

      @keyframes scan {
        0% { transform: translateY(-44px); opacity: 0; }
        12% { opacity: 1; }
        88% { opacity: 1; }
        100% { transform: translateY(252px); opacity: 0; }
      }

      @keyframes pulseRing {
        0%, 100% { transform: scale(1); opacity: 0.42; }
        50% { transform: scale(1.75); opacity: 0.08; }
      }

      @keyframes waveFlow {
        0% { stroke-dashoffset: 300; }
        100% { stroke-dashoffset: 0; }
      }

      .scanline {
        animation: scan 8s linear infinite;
      }

      .pulse-ring {
        transform-box: fill-box;
        transform-origin: center;
        animation: pulseRing 2.8s ease-in-out infinite;
      }

      .wave-flow {
        animation: waveFlow 4.2s linear infinite;
      }

      @media (prefers-reduced-motion: reduce) {
        .scanline,
        .pulse-ring,
        .wave-flow {
          animation: none;
        }
      }
    </style>
  </defs>

  <!-- Outer Card Shell -->
  <rect x="1" y="1" width="838" height="246" rx="16" fill="url(#cardBg)" stroke="#202a38" stroke-width="1.2"/>

  <!-- Clipped Architectural Background Layers -->
  <g clip-path="url(#cardClip)">
    <rect x="1" y="1" width="838" height="246" fill="url(#ambientGlow)"/>
    <rect x="1" y="1" width="838" height="246" fill="url(#dotMatrix)" mask="url(#dotMask)"/>
    <rect x="1" y="0" width="838" height="40" fill="url(#scanGrad)" class="scanline"/>
  </g>

  <!-- Top-Left Architectural Accent Bar -->
  <rect x="28" y="1" width="64" height="2" rx="1" fill="#00f59b"/>

  <!-- Top-Right Status Pill (Zero Overlap Geometry) -->
  <g>
    <rect x="596" y="24" width="216" height="26" rx="13" fill="#111824" stroke="#2e3b4e" stroke-width="1"/>
    <circle cx="612" cy="37" r="4.5" fill="#00f59b" opacity="0.35" class="pulse-ring"/>
    <circle cx="612" cy="37" r="3" fill="#00f59b"/>
    <text x="626" y="41" text-anchor="start" fill="#edf4f2" class="mono" font-size="10.5" font-weight="600" letter-spacing="0.8">AVAILABLE FOR WORK</text>
  </g>

  <!-- Left Identity Block -->
  <g>
    <text x="36" y="42" fill="#00f59b" class="mono" font-size="11" font-weight="600" letter-spacing="1.2">AMIRPRGRMR // DEVELOPER OS</text>

    <text x="36" y="86" fill="#edf4f2" class="sans" font-size="32" font-weight="700" letter-spacing="-0.6">Amirali Homayoonzadeh</text>

    <text x="36" y="114" fill="#8b9baa" class="sans" font-size="15" font-weight="500">Full-Stack Web Developer <tspan fill="#22d3ee">·</tspan> UI/UX Designer</text>

    <text x="36" y="142" fill="#64748b" class="sans" font-size="13" font-weight="400">Fast web platforms, native Linux desktop tools, and interactive interfaces.</text>

    <line x1="36" y1="173" x2="546" y2="173" stroke="#202a38" stroke-width="1" opacity="0.7"/>

    <!-- Bottom Info Strip -->
    <g>
      <rect x="36" y="198" width="174" height="26" rx="13" fill="#111824" stroke="#202a38" stroke-width="1"/>
      <text x="123" y="215" text-anchor="middle" fill="#cbd5e1" class="mono" font-size="10.5" font-weight="500">Parch Linux · Wayland</text>

      <rect x="220" y="198" width="184" height="26" rx="13" fill="#111824" stroke="#202a38" stroke-width="1"/>
      <text x="312" y="215" text-anchor="middle" fill="#cbd5e1" class="mono" font-size="10.5" font-weight="500">PHP 8.2 · Next.js · TS</text>

      <rect x="414" y="198" width="106" height="26" rx="13" fill="#111824" stroke="#202a38" stroke-width="1"/>
      <text x="467" y="215" text-anchor="middle" fill="#cbd5e1" class="mono" font-size="10.5" font-weight="500">Tehran, IR</text>
    </g>
  </g>

  <!-- Right Side Visual Motif: Multi-Layer Wireframe Oscilloscope -->
  <g>
    <!-- Back Wireframe Layer -->
    <rect x="602" y="72" width="202" height="134" rx="10" fill="none" stroke="#202a38" stroke-width="1" opacity="0.85"/>
    <line x1="762" y1="78" x2="794" y2="78" stroke="#2e3b4e" stroke-width="1" stroke-linecap="round"/>

    <!-- Front Oscilloscope Card -->
    <rect x="590" y="82" width="204" height="136" rx="10" fill="url(#oscBg)" stroke="#2e3b4e" stroke-width="1"/>
    <rect x="604" y="82" width="28" height="2" rx="1" fill="#22d3ee" opacity="0.85"/>

    <!-- Micro Header -->
    <line x1="590" y1="106" x2="794" y2="106" stroke="#202a38" stroke-width="1" opacity="0.85"/>
    <rect x="602" y="91" width="6" height="6" rx="1.5" fill="none" stroke="#00f59b" stroke-width="1.2"/>
    <text x="614" y="97.5" fill="#64748b" class="mono" font-size="8.5" font-weight="600" letter-spacing="0.7">SIGNAL // TRACE</text>

    <rect x="766" y="95" width="2" height="4" rx="0.5" fill="#22d3ee" opacity="0.45"/>
    <rect x="771" y="92" width="2" height="7" rx="0.5" fill="#22d3ee" opacity="0.65"/>
    <rect x="776" y="89" width="2" height="10" rx="0.5" fill="#00f59b" opacity="0.75"/>

    <!-- Oscilloscope Reticle Grid -->
    <line x1="598" y1="160" x2="786" y2="160" stroke="#202a38" stroke-width="0.9" stroke-dasharray="3 3"/>
    <line x1="692" y1="114" x2="692" y2="206" stroke="#202a38" stroke-width="0.9" stroke-dasharray="3 3"/>
    <line x1="598" y1="134" x2="786" y2="134" stroke="#17202d" stroke-width="0.8"/>
    <line x1="598" y1="186" x2="786" y2="186" stroke="#17202d" stroke-width="0.8"/>

    <!-- Subtle Harmonic Reference Curve -->
    <path d="M 598 164 C 618 164, 626 144, 646 144 C 668 144, 676 180, 698 180 C 720 180, 730 140, 752 140 C 768 140, 776 158, 786 158" fill="none" stroke="#22d3ee" stroke-width="1" opacity="0.22" stroke-linecap="round"/>

    <!-- Waveform Area Wash -->
    <path d="M 598 162 C 614 162, 622 130, 640 130 C 660 130, 674 184, 694 184 C 714 184, 728 136, 748 136 C 764 136, 774 158, 786 158 L 786 206 L 598 206 Z" fill="url(#waveArea)"/>

    <!-- Primary Base Waveform -->
    <path d="M 598 162 C 614 162, 622 130, 640 130 C 660 130, 674 184, 694 184 C 714 184, 728 136, 748 136 C 764 136, 774 158, 786 158" fill="none" stroke="url(#waveGrad)" stroke-width="1.5" opacity="0.48" stroke-linecap="round"/>

    <!-- Animated Signal Pulse Trace -->
    <path d="M 598 162 C 614 162, 622 130, 640 130 C 660 130, 674 184, 694 184 C 714 184, 728 136, 748 136 C 764 136, 774 158, 786 158" fill="none" stroke="url(#waveGrad)" stroke-width="1.8" opacity="0.9" stroke-linecap="round" pathLength="300" stroke-dasharray="64 236" class="wave-flow"/>

    <!-- 3 Crisp Geometric Nodes -->
    <line x1="640" y1="130" x2="640" y2="160" stroke="#22d3ee" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.4"/>
    <circle cx="640" cy="130" r="6" fill="none" stroke="#22d3ee" stroke-width="0.8" opacity="0.32"/>
    <circle cx="640" cy="130" r="3" fill="#0c1119" stroke="#22d3ee" stroke-width="1.5"/>

    <line x1="694" y1="184" x2="694" y2="160" stroke="#00f59b" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.4"/>
    <rect x="691" y="181" width="6" height="6" rx="1" transform="rotate(45 694 184)" fill="#0c1119" stroke="#00f59b" stroke-width="1.5"/>

    <line x1="748" y1="136" x2="748" y2="160" stroke="#00f59b" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.4"/>
    <circle cx="748" cy="136" r="6" fill="none" stroke="#00f59b" stroke-width="0.8" opacity="0.32"/>
    <circle cx="748" cy="136" r="3" fill="#0c1119" stroke="#00f59b" stroke-width="1.5"/>
  </g>
</svg>

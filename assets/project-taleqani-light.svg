<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 124" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="TaleqaniSchool Online Exam System — Exam platform serving ~400 concurrent students and 3,545+ submissions live.">
  <title>TaleqaniSchool Online Exam System</title>
  <defs>

      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif; }
      .mono { font-family: "JetBrains Mono", "Fira Code", SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>

  <rect x="1" y="1" width="838" height="122" rx="14" fill="url(#cardBg)" stroke="#e2e8f0" stroke-width="1.2"/>

  <rect x="24" y="1" width="48" height="2" rx="1" fill="#059669"/>

  <!-- Left Column -->
  <text x="28" y="28" class="mono" font-size="10.5" font-weight="600" letter-spacing="1.0" fill="#059669">01 // EDTECH · HIGH CONCURRENCY</text>
  <text x="28" y="56" class="sans" font-size="19" font-weight="700" letter-spacing="-0.3" fill="#0f172a">TaleqaniSchool Online Exam System</text>
  <text x="28" y="80" class="sans" font-size="13" font-weight="400" fill="#475569">Exam platform serving ~400 concurrent students and 3,545+ submissions live.</text>
  <text x="28" y="104" class="mono" font-size="11" font-weight="500" fill="#64748b">PHP · Modern Web Stack · UI/UX Design · Anti-Cheat · Live Telemetry</text>

  <!-- Right Column: Status Pill -->
  <g>
    <rect x="684" y="16" width="130" height="24" rx="12" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
    <text x="788" y="31.5" text-anchor="end" class="mono" font-size="10" font-weight="600" letter-spacing="0.45" fill="#334155">400+ CONCURRENT</text>
    <path d="M 795 31.5 L 802 24.5 M 797 24.5 H 802 V 29.5" fill="none" stroke="#059669" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Right Column: Domain Glyph Box (42x42 at x=772, y=56) -->
  <g>
    <rect x="772" y="56" width="42" height="42" rx="10" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
    <g transform="translate(781, 65)">
